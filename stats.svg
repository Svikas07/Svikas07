<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e91e90"/>
      <stop offset="100%" stop-color="#9b59b6"/>
    </linearGradient>
    <filter id="sGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="500" height="220" rx="12" fill="#0d0117" stroke="#e91e90" stroke-width="1"/>
  <text x="250" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ff69b4">&#x1F4CA; GitHub Stats</text>

  <!-- Rank ring -->
  <g transform="translate(80, 130)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2d1b4e" stroke-width="8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#sGrad)" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="314" stroke-linecap="round" transform="rotate(-90)" filter="url(#sGlow)">
      <animate attributeName="stroke-dashoffset" from="314" to="60" dur="2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="bold" fill="#ff69b4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>B+
    </text>
    <text x="0" y="12" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c4a0e8">Rank</text>
  </g>

  <!-- Stat rows -->
  <g font-family="'Segoe UI', sans-serif" font-size="13">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      <text x="170" y="65" fill="#c4a0e8">&#x2B50; Total Stars:</text><text x="380" y="65" fill="#fff" text-anchor="end">0</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
      <text x="170" y="90" fill="#c4a0e8">&#x1F500; Total PRs:</text><text x="380" y="90" fill="#fff" text-anchor="end">5</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
      <text x="170" y="115" fill="#c4a0e8">&#x1F41B; Total Issues:</text><text x="380" y="115" fill="#fff" text-anchor="end">2</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <text x="170" y="140" fill="#c4a0e8">&#x1F4E6; Total Repos:</text><text x="380" y="140" fill="#fff" text-anchor="end">20</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
      <text x="170" y="165" fill="#c4a0e8">&#x1F525; Commits (2026):</text><text x="380" y="165" fill="#fff" text-anchor="end">150+</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
      <text x="170" y="190" fill="#c4a0e8">&#x1F465; Followers:</text><text x="380" y="190" fill="#fff" text-anchor="end">1</text></g>
  </g>

  <!-- Shine sweep -->
  <rect x="-100" y="0" width="60" height="220" rx="12" fill="rgba(255,255,255,0.03)" transform="skewX(-20)">
    <animate attributeName="x" values="-100;600" dur="4s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>